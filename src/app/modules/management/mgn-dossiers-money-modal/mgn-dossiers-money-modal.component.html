<h2 mat-dialog-title>
  Liste des versements
</h2>

<div class="container">

  <table mat-table [dataSource]="data.payments" class="mat-elevation-z2 full-width">

    <!-- Label -->
    <ng-container matColumnDef="label">
      <th mat-header-cell *matHeaderCellDef> Libellé </th>
      <td mat-cell *matCellDef="let element">
        {{ element.label }}
      </td>
    </ng-container>

    <!-- Reference -->
    <ng-container matColumnDef="reference">
      <th mat-header-cell *matHeaderCellDef> Référence </th>
      <td mat-cell *matCellDef="let element">
        {{ element.referennce }}
      </td>
    </ng-container>

    <!-- Amount -->
    <ng-container matColumnDef="amount">
      <th mat-header-cell *matHeaderCellDef> Montant </th>
      <td mat-cell *matCellDef="let element" class="amount">
        {{ element.amount | currency:'XAF':'symbol':'1.0-0' }}
      </td>
    </ng-container>

    <!-- Date -->
    <ng-container matColumnDef="date">
      <th mat-header-cell *matHeaderCellDef> Date </th>
      <td mat-cell *matCellDef="let element">
        {{ element.creationDate | date:'dd/MM/yyyy HH:mm' }}
      </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>

  </table>

  <div class="total-section">
    Total versé :
    <strong>{{ getTotal() | currency:'XAF':'symbol':'1.0-0' }}</strong>
  </div>

</div>
