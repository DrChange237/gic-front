<div class="modal-body text-center center flex-column mt-2">
    <div class="avatar rounded-full center text-white" [ngClass]="{'bg-success': isSuccess, 'bg-danger': !isSuccess}">
        <i class="text-78" [ngClass]="{'i-Yes': isSuccess, 'i-Close': !isSuccess}"></i>
    </div>
    <h5 class="my-3 text-24 fw-semibold">{{ title | translate }}</h5>

    <p class="text-14 fw-medium mb-0">{{ message | translate }}</p>
</div>

<div class="modal-footer justify-content-center border-0 mb-2">
    <button type="button" class="btn" [ngClass]="isSuccess ? 'btn-success text-white' : 'btn-danger'" (click)="close()">
        {{ closeButtonText | translate }}
    </button>
    @if (actionButtonText) {
        <button type="button" class="btn btn-primary" (click)="close('action')">
            {{ actionButtonText | translate }}
        </button>
    }
</div>
