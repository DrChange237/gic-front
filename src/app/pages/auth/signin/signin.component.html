<div class="card o-hidden" [@animate]="{value:'*',params:{y:'120px',opacity:'0',delay:'100ms', duration: '400ms'}}">
  <div class="row">
    <div class="col-md-6">
      <div class="p-4">
        <div class="auth-logo text-center mb-4">
          <img src="assets/images/logo-text.png" alt="">
        </div>
        <div class="mb-3">
          <h1 class="mb-2 text-18">{{ 'sessions.sign_in' | translate }}</h1>
          <p>{{ 'sessions.welcome' | translate }}</p>
        </div>
        <form [formGroup]="signinForm" (ngSubmit)="signIn()">
          @if (alert.show) {
            <div class="col-md-12">
              <ngb-alert class="py-3 rounded-5" [type]="alert.type" [dismissible]="false">
                  <i class="i-Information text-16 me-1"></i> {{ alert.message | translate }}
              </ngb-alert>
            </div>
          }
          <div class="form-group">
            <label for="email">{{ 'form.username_label' | translate }}</label>
            <input id="email" class="form-control form-control-rounded" formControlName="email" type="text"
                [placeholder]="'form.email_plh' | translate">
          </div>
          <div class="form-group">
            <label for="password">{{ 'form.password_label' | translate }}</label>
            <input id="password" class="form-control form-control-rounded" formControlName="password" type="password"
                [placeholder]="'*******'">
          </div>
<!--           <button class="btn btn-rounded btn-primary w-100 mt-2">Sign In</button>-->
          <btn-loading btnClass="btn-primary btn-rounded w-100 mt-3" [loadingText]="loadingText" [loading]="loading">
              {{ 'sessions.sign_in' | translate }}
          </btn-loading>
        </form>

        <div class="mt-3 text-center">
          <a href="" class="text-muted" routerLink="/sessions/forgot"><u>{{ 'sessions.forgot_password' | translate }}</u></a>
        </div>
      </div>
    </div>
    <div class="col-md-6 text-center " style="background-size: cover;background-image: url(./assets/images/photo-long-3.jpg)"></div>
  </div>
</div>
